<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar{
            background-color: bisque;
            border-radius:30px;
        }
        .navbar ul{
            overflow:auto;

        }
        .navbar li{
            float:left;
            list-style:none;
            margin:13px 20px;

        }
        .navbar li a{
            padding:3px 3px;
            text-decoration: none;
            color:aquamarine;
            
        }
        .navbar li a:hover{
            color:red;

        }
        .search{
            float:right;
            color:aliceblue;
            padding: 19px 90px;

        }
        .navbar input{
            border:2px solid black;
            border-radius:13px;
            padding:3px 18px;
            width:130px;

        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
         <li>Home</li>
         <li>about</li>
         <li>services</li>
         <li>contact</li>
         <div class="search">
            <input type="text" name="search" id="search" placeholder="Search">
         </div>
        </ul>
    </nav>
</body>
</html>
