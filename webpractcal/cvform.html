<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
 <link rel="stylesheet" href="bio.css" type="text/css">
</head>
<body>
 
  <div class="form-container">
  <h2 style="text-align: center;">Registration Form</h2>
    <form action="">
      <label class="form-label">First Name:</label>
      <input class="form-input" type="text" name="F_Name" placeholder="Enter your first name">
    
      <br><br>
    
      <label class="form-label">Last Name:</label>
      <input class="form-input" type="text" name="L_Name" placeholder="Enter your last name">

      <br><br>
    
      <label class="form-label">Email:</label>
      <input class="form-input" type="email" name="Email" placeholder="Enter your email or gmail">
    
      
      <br><br>
    
      <label class="form-label">Phone Number:</label>
      <input class="form-input" type="number" name="PhoneNum" placeholder="Enter your phone number">

      <br><br>
    
      <label class="form-label">Telephone Number:</label>
      <input class="form-input" type="number" name="PhoneNum" placeholder="Enter your phone number">

      
      <br><br>

      <label class="form-label">Address:</label>
      <input class="form-input" type="text" name="Address" placeholder="Enter your address">

      <br><br>

      <label class="form-label">Provience:</label>
        <select name="provience" id="provience">
           <option value="#" selected="selected">Provience</option>
           <option value="#" >Provience 1</option>
           <option value="#" >Provience 2</option>
           <option value="#" >Provience 3</option>
           <option value="#" >provience 4</option>
           <option value="#" >provience 5</option>
           <option value="#" >provience 6</option>
           <option value="#" >provience 7</option>
        </select>
      <br><br>

      <label class="form-label">Gender:</label>
      <input  type="radio" name="gender" >Male
      <input  type="radio" name="gender" >Female
      <input  type="radio" name="gender" >Others
      
      <br><br>

      <label class="form-label">Your Photo:</label>
      <input class="form-input" type="file" name="image" >

      <br><br>
      <button class="form-cancel" id="cancelbutton">Cancel</button>
      <button class="form-submit" id="submitbutton">Submit</button>
      
    </form>
  </div>
</body>
</html>
