<html>
    <head>
        <title>Contact content</title>
        <style>
            *, *:before, *:after{
             box-sizing:border-box;
             -webkit-font-smoothing: antialiased;
             -moz-osx-font-smoothing: grayscale;
             
            }
            body{
                background: #b2aac1;
                font-size: 12px;
            }
            body,button,input{
                font-family:'montserrat',sans-serif;
                font-weight: 700;
                letter-spacing: 1.4px;
            }
            .background{
                display:flex;
                min-height: 100vh;
            }
            .container{
                flex:0 1 700px;
                margin:auto;
                padding:15px;

            }
            .screen:after{
                content:'';
                display: block;
                position :absolute;
                top:0;
                left:28px;
                right:20px;
                botton:0;
                border-radius:15px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.4);
                z-index:-1;
            }

            .screen-header{
                display:flex;
                align-items:center;
                padding:10px 20px;
                background: #4d4d4d;
                border-top-left-radius: 15px;
                border-top-right-radius: 15px;
            }
            .screen-header-left{
                margin-right:auto;
            }
            .screen-header-button{
                display:inline-block;
                width:8px;
                height:8px;
                margin-right:3px ;
                border-radius:8px;
                background:rgb(164, 30, 30);
            }
            .screen-header-button.close{
                background:#a872ff;
            }
            .screen-header-button.maxmize{
                background:#e8e925;

            }
            .screen-header-button.minimize{
                background:#74c54f;
            }
            .screen-header-right{
                display:flex;
                
            }
            .screen-header-ellipsis{
                width:3px;
                height:3px;
                margin-left:2px;
                border-radius:8px;
                background:#a5181840;
             
            }
            .screen-body{
                display:flex;

            }
            .screen-body-item{
                flex:1;
                padding:50px;

            }
            .screen-body-item-left{
                display:flex;
                flex-direction:column;
            }
            .app-title{
                display: flex;
                flex-direction: column;
                position:relative;
                color:#a872ff;
                font-size:26px;
            }
            .app-title:after{
                content:"";
                display:block;
                position:absolute;
                left:0;
                bottom:-10px;
                width:25px;
                height:4px;
                background:#a872ff;
            }
            .app-contact{
                margin-top:auto;
                font-size:8px;
                color:#888;
            }
            .app-form-group{
                margin-bottom:15px;

            }
            .app-form-group.message{
                margin-top:40px;
                     }
                     .app-form-group.buttons{
                        margin-bottom:0;
                        text-align:right;
                     }
        </style>
    </head>
    <body>
        <div class="background">
            <div class="container">	
                <div class="screen">
                    <div class="screen-header">
                        <div class="screen-header-left">
                            <div class="screen-header-button close"> </div>
                                <div class="screen-header-button maximize"></div>
                           
                            </div>
                         <div class="screen-header-right">
                             <div class="screen-header-right"></div>
                             <div class="screen-header-right"></div>
                             <div class="screen-header-right"></div>
                         </div>
                        </div>
                        <div class="screen-body">
                           <div class="screen-body-item left">
                              <div class="app-title">
                                 <span>contact</span>
                                 <span>us</span>
                              </div>
                            <div class="app-contact">Contact information:9817839120</div>
                        </div>
                        <div class="screen-body-item">
                            <div class="app-form">
                               <div class="app-form-group">
                                   <input class="app-form-control" placeholder="NAME">
                               </div>
                               <div class="app-form-group">
                                   <input class="app-form-control" placeholder="EMAIL">
                               </div>
                               <div class="app-form-group">
                                   <input class="app-form-control" placeholder="CONTACT US">
                               </div>
                               <div class="app-form-group message">
                                  <input class="app-form-control" placeholder="MESSAGE">
                               </div>
                               <div class="app-form-group buttons">
                                   <button class="äpp-form-button">CANCEL</button>
                                   <button class="äpp-form-button">SEND</button>
                                </div>
                           </div>

                        </div>
                    </div>
               </div>  
           </div>     
        </div>
    </body>
</html>
