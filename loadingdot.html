<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e272e;
            overflow: hidden;
        }

        .loading {
            display: flex;
            gap: 10px;
        }

        .loading span {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #84adbf, #2779bb);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8); /* Increased shadow blur */
            animation: jumpingDots 1.8s cubic-bezier(0.4, 0.0, 0.2, 1) infinite; /* Easing function */
            transform-origin: bottom center; /* Set transform origin */
        }

        .loading span:nth-child(2) {
            animation-delay: 0.4s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.8s;
        }

        @keyframes jumpingDots {
          
            40% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            }
            60% {
                transform: translateY(-25px) scaleY(1.1); /* Smaller jump, less scale */
                opacity: 0.9;
                box-shadow: 0 6px 15px rgba(0, 0, 0, 0.55);
            }
            80%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            }
        }

     
    </style>
</head>
<body>
    <div class="loading">
        <span></span>
        <span></span>
        <span></span>
    </div>
    
</body>
</html>
