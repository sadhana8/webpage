<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Card</title>
    <style>

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4; 
        }


        .card {
            width: 350px; 
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); 
            overflow: hidden; 
            transition: transform 0.2s; 
        }

        .card:hover {
            transform: scale(1.02); 
        }

        .card-header {
            height: 200px;
            overflow: hidden; 
        }

        .card-header img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block; 
        }


        .card-content {
            padding: 20px;
        }

    
        .card-title {
            font-size: 1.5rem;
            font-weight: 600; 
            margin-bottom: 10px;
            color: #333; 
        }


        .card-description {
            font-size: 1rem;
            color: #666;
            line-height: 1.6; 
            margin-bottom: 15px;
        }

  
        .card-button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff; 
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .card-button:hover {
            background-color: #0056b3;
        }

        .card-footer {
            background-color: #f8f9fa; 
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card">
        <div class="card-header">
            <img src="photo.jpg" alt="Card Image">  </div>
        <div class="card-content">
            <h2 class="card-title">Product Title</h2>
            <p class="card-description">This is a brief description of the product or service.  It should be concise and engaging.</p>
            <a href="#" class="card-button">Learn More</a>
        </div>
        <div class="card-footer">
            &copy; 2023 Company Name
        </div>
    </div>
</div>

</body>
</html>
