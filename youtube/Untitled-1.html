<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Glass Auth</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Body + Background */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      overflow: hidden;
      perspective: 1000px;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: #00e0ff;
      opacity: 0.7;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) translateX(0); opacity: 0.5; }
      50% { transform: translateY(-100vh) translateX(50vw); opacity: 1; }
      100% { transform: translateY(0) translateX(0); opacity: 0.5; }
    }

    /* Auth Card (Login/Signup) */
    .auth-card {
      width: 350px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 40px #00e0ff;
      text-align: center;
      color: #fff;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    /* Tilt on hover */
    .auth-card:hover {
      transform: rotateY(10deg) rotateX(10deg);
    }

    /* Heading */
    .auth-card h2 {
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00e0ff;
    }

    /* Input boxes */
    .input-box {
      position: relative;
      margin: 20px 0;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-bottom: 2px solid #00e0ff;
      background: transparent;
      color: #fff;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-bottom: 2px solid #ff00ff;
    }

    .input-box label {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      color: #00e0ff;
      pointer-events: none;
      transition: 0.3s;
    }

    .input-box input:focus ~ label,
    .input-box input:valid ~ label {
      top: -10px;
      font-size: 12px;
      color: #ff00ff;
    }

    /* Buttons */
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #00e0ff, #ff00ff);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #00e0ff;
      transition: 0.3s;
    }

    button:hover {
      box-shadow: 0 0 30px #ff00ff;
      transform: scale(1.05);
    }

    /* Optional toggle links */
    .toggle-link {
      margin-top: 15px;
      font-size: 14px;
      color: #00e0ff;
      cursor: pointer;
      text-decoration: underline;
    }
    .toggle-link:hover {
      color: #ff00ff;
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <script>
    for(let i=0;i<50;i++){
      const p=document.createElement('div');
      p.classList.add('particle');
      p.style.left=Math.random()*100+'vw';
      p.style.top=Math.random()*100+'vh';
      p.style.width=2+Math.random()*4+'px';
      p.style.height=2+Math.random()*4+'px';
      p.style.animationDuration=5+Math.random()*10+'s';
      document.body.appendChild(p);
    }
  </script>

  <!-- Login Card -->
  <div class="auth-card" id="login-card">
    <h2>Login</h2>
    <div class="input-box">
      <input type="text" required>
      <label>Username</label>
    </div>
    <div class="input-box">
      <input type="password" required>
      <label>Password</label>
    </div>
    <button>Login</button>
    <div class="toggle-link" onclick="toggleAuth()">Don't have an account? Signup</div>
  </div>

  <!-- Signup Card (hidden initially) -->
  <div class="auth-card" id="signup-card" style="display:none;">
    <h2>Signup</h2>
    <div class="input-box">
      <input type="text" required>
      <label>Username</label>
    </div>
    <div class="input-box">
      <input type="email" required>
      <label>Email</label>
    </div>
    <div class="input-box">
      <input type="password" required>
      <label>Password</label>
    </div>
    <button>Signup</button>
    <div class="toggle-link" onclick="toggleAuth()">Already have an account? Login</div>
  </div>

  <script>
    function toggleAuth(){
      const loginCard = document.getElementById('login-card');
      const signupCard = document.getElementById('signup-card');
      if(loginCard.style.display === 'none'){
        loginCard.style.display = 'block';
        signupCard.style.display = 'none';
      } else {
        loginCard.style.display = 'none';
        signupCard.style.display = 'block';
      }
    }
  </script>

</body>
</html>
